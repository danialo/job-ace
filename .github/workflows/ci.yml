name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend/ cli/ tests/ --exit-zero

      - name: Test
        run: |
          python -m pytest tests/ \
            -m "not e2e" \
            -k "not test_anthropic_client_fallback_on_error"
